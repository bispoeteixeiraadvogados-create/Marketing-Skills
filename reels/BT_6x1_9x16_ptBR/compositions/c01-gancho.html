      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const cartoes = ["#c01-c0", "#c01-c1", "#c01-c2", "#c01-c3", "#c01-c4", "#c01-c5", "#c01-c6"];
          const trabalho = cartoes.slice(0, 6);

          tl.fromTo("#c01-marca", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "bt-enter" }, 0);
          tl.fromTo(cartoes, { opacity: 0, x: -48 }, { opacity: 1, x: 0, duration: 0.4, ease: "bt-enter", stagger: 0.04 }, 0);
          tl.fromTo(trabalho, { backgroundColor: "#f4ede2", color: "#202631" }, { backgroundColor: "#0b1f4b", color: "#faf8f4", duration: 0.2, ease: "bt-standard", stagger: 0.06 }, 0.4);
          tl.fromTo("#c01-col-trabalho", { strokeDasharray: 700, strokeDashoffset: 700 }, { strokeDashoffset: 0, duration: 0.4, ease: "bt-standard" }, 0.85);
          tl.fromTo("#c01-rot-trabalho", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "bt-enter" }, 0.95);
          tl.fromTo("#c01-c6", { backgroundColor: "#f4ede2", color: "#202631" }, { backgroundColor: "#8fc5ef", color: "#0b1f4b", duration: 0.2, ease: "bt-standard" }, 1.4);
          tl.fromTo("#c01-col-folga", { strokeDasharray: 140, strokeDashoffset: 140 }, { strokeDashoffset: 0, duration: 0.3, ease: "bt-standard" }, 1.45);
          tl.fromTo("#c01-rot-folga", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "bt-enter" }, 1.5);
          tl.fromTo("#c01-c6", { scale: 1 }, { scale: 1.04, duration: 0.18, ease: "bt-overshoot" }, 1.5);
          tl.to("#c01-c6", { scale: 1, duration: 0.22, ease: "bt-standard" }, 1.68);
          tl.fromTo("#c01-corredor", { x: -220 }, { x: 1300, duration: 2.0, ease: "power1.in" }, 0.3);
          tl.fromTo("#c01-legenda", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0);
          tl.fromTo("#c01-w1", { color: "#faf8f4" }, { color: "#d4af7c", duration: 0.1 }, 1.5);

          window.__timelines["c01-gancho"] = tl;
        })();
