<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

  <body>
    <template>
      <style>
        @font-face { font-family: "Cormorant Garamond"; font-weight: 600; src: url("assets/fonts/cormorant-garamond-latin-600-normal.woff2") format("woff2"); }
        @font-face { font-family: "Montserrat"; font-weight: 600; src: url("assets/fonts/montserrat-latin-600-normal.woff2") format("woff2"); }
        #root { position: absolute; inset: 0; overflow: hidden; background: #faf8f4; font-family: "Montserrat", Arial, sans-serif; }
        #c01-fundo { position: absolute; inset: 0;
          background:
            radial-gradient(circle at 820px 470px, rgba(143, 197, 239, 0.28) 0%, rgba(143, 197, 239, 0) 46%),
            linear-gradient(to right, rgba(11, 31, 75, 0.035) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(11, 31, 75, 0.035) 1px, transparent 1px);
          background-size: 100% 100%, 8px 8px, 8px 8px; }
        #c01-meta { position: absolute; left: 96px; top: 300px; font-size: 36px; font-weight: 600; letter-spacing: 0.12em; color: #214d8c; }
        #c01-titulo { position: absolute; left: 88px; top: 350px; width: 760px; font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600;
          font-size: 300px; line-height: 1; letter-spacing: -0.02em; color: #0b1f4b; font-variant-numeric: lining-nums; font-feature-settings: "lnum" 1;
          transform-origin: 0% 60%; }
        .c01-cartao { position: absolute; top: 760px; width: 100px; height: 260px; border-radius: 16px; background: #f4ede2;
          box-shadow: 0 18px 40px rgba(8, 26, 53, 0.12); display: flex; align-items: center; justify-content: center;
          font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; font-size: 104px; line-height: 1; color: #202631; }
        #c01-c0 { left: 98px; } #c01-c1 { left: 210px; } #c01-c2 { left: 322px; } #c01-c3 { left: 434px; }
        #c01-c4 { left: 546px; } #c01-c5 { left: 658px; } #c01-c6 { left: 798px; }
        #c01-colchetes { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
        .c01-rotulo { position: absolute; top: 1044px; font-size: 36px; font-weight: 600; line-height: 1.2; letter-spacing: 0.04em; }
        #c01-rot-trabalho { left: 98px; width: 660px; text-align: center; color: #0b1f4b; }
        #c01-rot-folga { left: 760px; width: 140px; text-align: right; color: #214d8c; }
        #c01-corredor { position: absolute; left: 0; top: 546px; width: 168px; height: 196px; }
        #c01-corredor svg { display: block; width: 168px; height: 196px; }
      </style>

      <div id="root" data-composition-id="c01-gancho" data-width="1080" data-height="1920">
        <div id="c01-fundo"></div>
        <div id="c01-meta">ESCALA</div>
        <div id="c01-titulo">6x1</div>

        <div id="c01-c0" class="c01-cartao" data-layout-allow-overlap>S</div>
        <div id="c01-c1" class="c01-cartao" data-layout-allow-overlap>T</div>
        <div id="c01-c2" class="c01-cartao" data-layout-allow-overlap>Q</div>
        <div id="c01-c3" class="c01-cartao" data-layout-allow-overlap>Q</div>
        <div id="c01-c4" class="c01-cartao" data-layout-allow-overlap>S</div>
        <div id="c01-c5" class="c01-cartao" data-layout-allow-overlap>S</div>
        <div id="c01-c6" class="c01-cartao" data-layout-allow-overlap>D</div>

        <svg id="c01-colchetes" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path id="c01-col-trabalho" d="M98 1010 V1024 H758 V1010" fill="none" stroke="#0b1f4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
          <path id="c01-col-folga" d="M798 1010 V1024 H898 V1010" fill="none" stroke="#214d8c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <div id="c01-rot-trabalho" class="c01-rotulo">TRABALHO</div>
        <div id="c01-rot-folga" class="c01-rotulo">FOLGA</div>

        <div id="c01-corredor" data-layout-allow-overflow data-hf-motion-blur='{"shutterAngle":180,"shutterPhase":-90,"samplesPerFrame":12}'>
          <svg viewBox="0 0 140 170" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <g fill="none" stroke="#0b1f4b" stroke-linecap="round" stroke-linejoin="round">
              <path d="M78 56 L60 76 L46 70" stroke-width="12" />
              <path d="M62 100 L50 128 L26 136" stroke-width="15" />
              <rect x="40" y="46" width="26" height="42" rx="9" transform="rotate(16.5 53 67)" fill="#0b1f4b" stroke="none" />
              <path d="M80 46 L64 100" stroke-width="30" />
              <path d="M66 98 L92 112 L88 142 L100 146" stroke-width="15" />
              <path d="M80 54 L98 70 L112 56" stroke-width="12" />
            </g>
            <circle cx="88" cy="24" r="16" fill="#0b1f4b" />
          </svg>
        </div>
      </div>

      <script>
        (function () {
          const T = (window.BT_T && window.BT_T.c01) || { dur: 2.93, k: { um: 1.92, trabalho: 0.9 } };
          const tl = gsap.timeline({ paused: true });
          const cartoes = ["#c01-c0", "#c01-c1", "#c01-c2", "#c01-c3", "#c01-c4", "#c01-c5", "#c01-c6"];
          const trabalho = cartoes.slice(0, 6);
          // O título está no primeiro quadro; só assenta.
          tl.fromTo("#c01-titulo", { scale: 1.04 }, { scale: 1, duration: 0.8, ease: "bt-emphasized" }, 0);
          tl.fromTo("#c01-fundo", { opacity: 0.6 }, { opacity: 1, duration: 1.2, ease: "none" }, 0);
          // Cascata dos cartões, 40 ms entre eles.
          tl.fromTo(cartoes, { opacity: 0, x: -48 }, { opacity: 1, x: 0, duration: 0.4, ease: "bt-enter", stagger: 0.04 }, 0.05);
          tl.fromTo(trabalho, { backgroundColor: "#f4ede2", color: "#202631" }, { backgroundColor: "#0b1f4b", color: "#faf8f4", duration: 0.22, ease: "bt-standard", stagger: 0.07 }, Math.max(0.35, T.k.trabalho - 0.45));
          BT.tracar(tl, "#c01-col-trabalho", 700, T.k.trabalho, 0.45);
          tl.fromTo("#c01-rot-trabalho", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "bt-enter" }, T.k.trabalho + 0.05);
          // Na palavra "um": o cartão de folga vira Sky, pulsa 4% e brilha.
          tl.fromTo("#c01-c6", { backgroundColor: "#f4ede2", color: "#202631" }, { backgroundColor: "#8fc5ef", color: "#0b1f4b", duration: 0.2, ease: "bt-standard" }, T.k.um - 0.05);
          BT.realce(tl, "#c01-c6", T.k.um, "rgba(143, 197, 239, 0.95)", 1.04);
          BT.tracar(tl, "#c01-col-folga", 140, T.k.um, 0.3);
          tl.fromTo("#c01-rot-folga", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "bt-enter" }, T.k.um + 0.05);
          // O pictograma atravessa correndo, levemente acelerado.
          tl.fromTo("#c01-corredor", { x: -220 }, { x: 1300, duration: 2.0, ease: "power1.in" }, 0.2);
          // Saída em match cut: a tira se comprime num único bloco.
          const fim = T.dur - 0.5;
          const esquerdas = [98, 210, 322, 434, 546, 658, 798];
          cartoes.forEach((c, i) => tl.to(c, { x: 448 - esquerdas[i], duration: 0.45, ease: "bt-standard" }, fim + i * 0.015));
          tl.to(["#c01-rot-trabalho", "#c01-rot-folga", "#c01-colchetes"], { opacity: 0, duration: 0.25 }, fim);
          window.__timelines["c01-gancho"] = tl;
        })();
      </script>
    </template>
  </body>
