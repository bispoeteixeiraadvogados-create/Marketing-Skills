      <script>
        (function () {
          const T = (window.BT_T && window.BT_T.c08) || { dur: 5.3, k: { doze: 0.25, quarenta: 2.55, sem: 3.85, salario: 4.71 } };
          const tl = gsap.timeline({ paused: true });
          const C = 2 * Math.PI * 240;
          const S = T.k.sem;
          // Etapa A: +12 meses e o relógio de 42 para 40.
          tl.fromTo("#c08-esq", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "bt-enter" }, 0);
          tl.fromTo("#c08-prazo", { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.45, ease: "bt-emphasized" }, T.k.doze);

          BT.tracar(tl, "#c08-linha", 780, T.k.doze, 1.0);
          tl.fromTo("#c08-marcador", { x: 0 }, { x: 780, duration: 1.0, ease: "bt-standard" }, T.k.doze);
          tl.fromTo(["#c08-num", "#c08-h"], { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.55, ease: "bt-emphasized" }, 0.35);
          tl.fromTo("#c08-arco", { strokeDasharray: C, strokeDashoffset: C }, { strokeDashoffset: C * (2 / 44), duration: 0.9, ease: "bt-standard" }, 0.35);
          tl.to("#c08-trilho", { y: -250, duration: 0.3, ease: "bt-standard" }, T.k.quarenta);
          tl.to("#c08-arco", { strokeDashoffset: C * (4 / 44), duration: 0.5, ease: "bt-standard" }, T.k.quarenta);
          BT.realce(tl, "#c08-num", T.k.quarenta + 0.1, "rgba(212, 175, 124, 0.95)", 1.08);
          // Etapa B: "Sem redução de salário", destaque principal, com as barras lado a lado.
          tl.to("#c08-a", { opacity: 0, y: -40, duration: 0.4, ease: "bt-exit" }, S - 0.25);
          tl.fromTo("#c08-titulo", { opacity: 0, y: 48, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "bt-emphasized" }, S - 0.05);
          BT.realce(tl, "#c08-titulo", S + 0.25, "rgba(212, 175, 124, 0.95)", 1.06);
          tl.fromTo(["#c08-horas", "#c08-bsal"], { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "bt-enter", stagger: 0.08 }, S + 0.05);
          tl.fromTo(["#c08-base", ".c08-rot"], { opacity: 0 }, { opacity: 1, duration: 0.4 }, S + 0.05);
          tl.fromTo("#c08-valor", { opacity: 0 }, { opacity: 1, duration: 0.3 }, S + 0.2);

          tl.set("#c08-valor", { textContent: "42 h" }, S + 0.6);

          tl.to("#c08-horas", { scaleY: 40 / 44, duration: 0.3, ease: "bt-standard" }, S + 0.95);
          tl.set("#c08-valor", { textContent: "40 h" }, S + 0.95);
