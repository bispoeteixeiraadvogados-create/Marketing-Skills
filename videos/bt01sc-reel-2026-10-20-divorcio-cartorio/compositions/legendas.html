<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Legendas queimadas (trilho literal da locução)</title>
  </head>
  <body>
    <template id="legendas-template">
      <div data-composition-id="legendas" data-width="1080" data-height="1920" data-duration="42">
        <style>
          @font-face {
            font-family: "Montserrat";
            src: url("../assets/fonts/Montserrat-latin.woff2") format("woff2");
            font-weight: 100 900;
            font-style: normal;
          }
          [data-composition-id="legendas"] {
            position: absolute;
            inset: 0;
            pointer-events: none;
          }
          /* bottom of the box at y = 1502: above the ~400 px Instagram UI band */
          #cap-rail {
            position: absolute;
            left: 90px;
            right: 90px;
            bottom: 418px;
            height: 200px;
          }
          #cap-rail .cap-box {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            width: fit-content;
            max-width: 900px;
            margin: 0 auto;
            padding: 14px 30px 16px;
            border-radius: 16px;
            background: rgba(8, 26, 53, 0.88);
            box-shadow: 0 0 0 1px rgba(212, 175, 124, 0.25);
            text-align: center;
            visibility: hidden;
          }
          #cap-rail .cap-box span {
            display: block;
            font-family: "Montserrat", Arial, sans-serif;
            font-weight: 600;
            font-size: 40px;
            line-height: 1.28;
            color: #faf8f4;
            white-space: nowrap;
          }
        </style>

        <div id="cap-rail"></div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            // CAPTIONS:BEGIN (generated by scripts/build_captions.py from the approved script + real word timings)
            const CAPTIONS = [{"start": 0.05, "end": 1.23, "lines": ["Tem filhos menores?"]}, {"start": 1.29, "end": 3.61, "lines": ["O divórcio pode ser feito", "em cartório?"]}, {"start": 3.67, "end": 6.13, "lines": ["Sim, em determinadas situações."]}, {"start": 6.33, "end": 9.57, "lines": ["Quando há filhos comuns", "menores ou incapazes,"]}, {"start": 9.63, "end": 11.47, "lines": ["guarda, convivência e alimentos"]}, {"start": 11.53, "end": 14.61, "lines": ["devem estar previamente", "resolvidos judicialmente."]}, {"start": 15.14, "end": 17.32, "lines": ["Não basta um acordo particular."]}, {"start": 17.38, "end": 19.2, "lines": ["É preciso comprovar ao cartório"]}, {"start": 19.26, "end": 22.11, "lines": ["a resolução judicial", "dessas questões."]}, {"start": 22.17, "end": 24.91, "lines": ["Com o consenso do casal,", "o divórcio pode ser feito"]}, {"start": 24.97, "end": 26.39, "lines": ["por escritura pública,"]}, {"start": 26.45, "end": 29.63, "lines": ["com assistência de advogado", "ou defensor público."]}, {"start": 31.11, "end": 32.51, "lines": ["A diferença é esta:"]}, {"start": 32.57, "end": 35.39, "lines": ["as questões dos filhos", "são tratadas na Justiça."]}, {"start": 35.45, "end": 38.21, "lines": ["O divórcio pode ser formalizado", "no cartório."]}, {"start": 39.26, "end": 41.9, "lines": ["Cada caso exige análise jurídica."]}];
            // CAPTIONS:END
            const tl = gsap.timeline({ paused: true });
            const rail = document.getElementById("cap-rail");
            CAPTIONS.forEach((c, i) => {
              const box = document.createElement("div");
              box.className = "cap-box";
              box.id = `cap-${String(i + 1).padStart(2, "0")}`;
              c.lines.forEach((line) => {
                const span = document.createElement("span");
                span.textContent = line;
                box.appendChild(span);
              });
              rail.appendChild(box);
              tl.fromTo(box, { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.14, ease: "power1.out" }, c.start);
              tl.fromTo(box, { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.05, ease: "none", immediateRender: false }, c.end - 0.05);
            });
            window.__timelines["legendas"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
