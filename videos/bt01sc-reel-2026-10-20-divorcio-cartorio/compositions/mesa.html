  <body>

        <div id="world" data-layout-allow-overflow>
          <div class="desk" data-layout-allow-overflow></div>

          <div class="pool" id="pool-f" data-layout-allow-overflow></div>
          <div class="pool" id="pool-e" data-layout-allow-overflow></div>

          <!-- Justiça: the folder that receives the three children's questions -->
          <div class="sheet" id="folder" data-layout-allow-overflow>
            <div id="folder-tab" data-layout-allow-overflow></div>
            <div class="card" id="folder-back"></div>
            <div class="sheet fsheet" id="fs1" data-layout-allow-overflow>
              <div class="lift"></div>
              <div class="face">
                <div class="label">GUARDA</div>
                <div class="lines"><i style="width: 92%"></i><i style="width: 84%"></i><i style="width: 88%"></i><i style="width: 60%"></i><i style="width: 90%"></i><i style="width: 74%"></i></div>

                  <div class="lines"><i style="width: 64%"></i><i style="width: 88%"></i><i style="width: 72%"></i><i style="width: 90%"></i><i style="width: 58%"></i><i style="width: 82%"></i><i style="width: 70%"></i></div>

          <!-- Cartório: escritura pública -->
          <div class="sheet" id="escritura" data-layout-allow-overflow>
            <div class="lift"></div>
            <div class="face paper">
              <div class="frame"></div>
              <div class="q-title">ESCRITURA PÚBLICA</div>
              <span class="rule"></span>
              <div class="lines"><i style="width: 100%"></i><i style="width: 94%"></i><i style="width: 98%"></i><i style="width: 90%"></i><i style="width: 96%"></i><i style="width: 70%"></i></div>
              <div class="lines second"><i style="width: 100%"></i><i style="width: 92%"></i><i style="width: 97%"></i><i style="width: 62%"></i></div>
            </div>
          </div>

          <!-- Scenes 01-02: the questions and the answer, lifted away together -->
          <div id="qgroup" data-layout-allow-overflow>
            <div class="sheet" id="q1" data-layout-allow-overflow data-layout-allow-overlap>
              <div class="lift"></div>
              <div class="face">
                <div class="q-title"><span class="line">FILHOS</span><span class="line">MENORES?</span></div>

                <div class="lines"><i style="width: 70%"></i><i style="width: 52%"></i></div>
              </div>
            </div>
            <div class="sheet" id="q2" data-layout-allow-overflow data-layout-allow-overlap>
              <div class="lift"></div>
              <div class="face paper">
                <div class="q-title"><span class="line">DIVÓRCIO EM</span><span class="line">CARTÓRIO?</span></div>
              </div>
            </div>
            <div class="sheet" id="sim" data-layout-allow-overflow>
              <div class="lift"></div>
              <div class="face">
                <div class="q-title">SIM,</div>

            </div>
            <div class="sheet" id="slip" data-layout-allow-overflow>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            const tl = gsap.timeline({ paused: true });

            // Camera: world point (cx, cy) at the frame centre, scale s. GSAP composes
            // translate then scale with origin 0 0, so screen = s * world + (x, y).
            const cam = (cx, cy, s) => ({ x: 540 - s * cx, y: 960 - s * cy, scale: s });
            const shot = (t, d, from, to, ease) =>
              tl.fromTo("#world", { ...from, transformOrigin: "0 0" }, { ...to, duration: d, ease, immediateRender: t === 0 }, t);
            const C = {
              open: cam(1180, 760, 1.1),
              follow: cam(1110, 800, 1.06),
              tilt: cam(1090, 880, 1.02),
              settle: cam(1085, 885, 1.0),
              simPush: cam(1080, 850, 1.07),
              folderIn: cam(790, 2595, 0.88),
              folderDrift: cam(750, 2595, 0.88),
              track: cam(610, 2595, 0.88),
              trackHold: cam(595, 2600, 0.9),
              coverPush: cam(560, 2500, 2.15),
              coverDrift: cam(590, 2520, 2.05),
              medium: cam(1150, 2490, 0.74),
              open5: cam(1240, 2490, 0.68),
              open5b: cam(1226, 2490, 0.665),
              wide: cam(1080, 2490, 0.5),
              wideHold: cam(1080, 2492, 0.49),
            };
            // Contiguous moves from 0 to 39.6 s, so every seek lands on an authored state.
            shot(0, 1.0, C.open, C.follow, "power2.out"); // close, following the first sheet
            shot(1.0, 1.2, C.follow, C.tilt, "sine.inOut");
            shot(2.2, 1.1, C.tilt, C.settle, "sine.out");
            shot(3.3, 2.7, C.settle, C.simPush, "sine.inOut"); // S2 push-in
            shot(6.0, 1.0, C.simPush, C.folderIn, "power3.inOut"); // paper edge reveals the folder
            shot(7.0, 2.2, C.folderIn, C.folderDrift, "sine.inOut");
            shot(9.2, 2.2, C.folderDrift, C.track, "power1.inOut"); // lateral tracking with the sheets
            shot(11.4, 3.05, C.track, C.trackHold, "sine.inOut");
            shot(14.45, 0.9, C.trackHold, C.coverPush, "power2.inOut"); // the cover becomes the frame
            shot(15.35, 6.2, C.coverPush, C.coverDrift, "sine.inOut");
            shot(21.55, 1.2, C.coverDrift, C.medium, "power3.inOut"); // pull back: folder settles left
            shot(22.75, 3.25, C.medium, C.open5, "power2.inOut"); // field of view opens for the escritura
            shot(26.0, 4.8, C.open5, C.open5b, "sine.inOut");
            shot(30.8, 3.4, C.open5b, C.wide, "power2.inOut"); // dolly-out: the synthesis
            shot(34.2, 5.4, C.wide, C.wideHold, "sine.out");

            // Paper: slides in with friction (decelerating, small settle) and a lifted shadow while moving.
            function slideIn(sel, t, d, from, to) {
              tl.fromTo(sel, from, { ...to, duration: d, ease: "power3.out" }, t);
              tl.fromTo(`${sel} > .lift`, { opacity: 0.85 }, { opacity: 0, duration: d * 0.9, ease: "power2.in" }, t);
            }
            // Text that a sheet physically covers is switched off once covered (identical pixels).
            const hideCovered = (sel, t) => tl.fromTo(sel, { opacity: 1 }, { opacity: 0, duration: 0.01, immediateRender: false }, t);

            // S1 · 0.0-3.5 · the questions
            slideIn("#q1", 0, 0.58, { x: 560, y: -30, rotation: 6.5, filter: "blur(3px)" }, { x: 0, y: 0, rotation: -1.2, filter: "blur(0px)" });
            slideIn("#q2", 0.92, 0.5, { x: 40, y: 980, rotation: -5 }, { x: 0, y: 0, rotation: 1.1 });
            tl.fromTo("#q1", { y: 0 }, { y: -10, duration: 0.3, ease: "power2.out", immediateRender: false }, 1.3); // contact nudge

            // S2 · 3.5-6.2 · the answer
            slideIn("#sim", 3.22, 0.54, { x: -1320, y: 40, rotation: -7 }, { x: 0, y: 0, rotation: 0.8 });
            hideCovered("#q1 .q-title, #q2 .q-title", 3.8);
            slideIn("#slip", 4.12, 0.42, { x: 1050, y: 30, rotation: 4 }, { x: 0, y: 0, rotation: -1.4 });
            // S2 -> S3: the papers are lifted away together; their edge wipes the frame open
            tl.fromTo("#qgroup", { y: 0, rotation: 0 }, { y: -1700, rotation: -2.5, duration: 0.95, ease: "power3.in" }, 5.95);
            tl.fromTo("#sim > .lift", { opacity: 0 }, { opacity: 0.9, duration: 0.4, ease: "power1.out", immediateRender: false }, 5.95);
            tl.fromTo("#pool-q", { opacity: 1 }, { opacity: 0.35, duration: 1.2, ease: "sine.inOut" }, 6.0);

            // S3 · 6.2-15.0 · guarda, convivência, alimentos
            tl.fromTo("#cover", { rotationY: -180, transformOrigin: "0% 50%" }, { rotationY: -180, duration: 0.01 }, 0);
            const fan = [
              { id: "#fs1", t: 9.36, x: -22, y: 6, r: -3.4 }, // lands on "guarda" (9.85)
              { id: "#fs2", t: 9.8, x: 26, y: 4, r: 2.6 }, // "convivência" (10.25)
              { id: "#fs3", t: 10.33, x: -12, y: 8, r: -1.5 }, // "alimentos" (10.83)
            ];
            fan.forEach((s, i) => {
              slideIn(s.id, s.t, 0.52, { x: 1500, y: -70 + i * 20, rotation: 9 }, { x: s.x, y: s.y, rotation: s.r });
              // the fan tightens: sheets squared to the folder's edge
              tl.fromTo(s.id, { x: s.x, y: s.y, rotation: s.r }, { x: 0, y: 0, rotation: [-0.5, 0.3, -0.2][i], duration: 0.75, ease: "power2.inOut", immediateRender: false }, 11.35 + i * 0.06);
            });
            tl.fromTo("#band", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 12.5); // "resolvidos" (12.59)
            tl.fromTo("#band span", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 12.65);
            // the folder closes partially; its surface becomes the next frame
            tl.fromTo("#cover", { rotationY: -180 }, { rotationY: -16, duration: 0.8, ease: "power2.inOut", immediateRender: false }, 14.05);
            hideCovered("#fs1 .label, #fs2 .label, #fs3 .label, #band span", 14.9);

            // S5 · the folder closes and stays organized on the left; the escritura arrives from the right
            tl.fromTo("#cover", { rotationY: -16 }, { rotationY: 0, duration: 0.55, ease: "power2.in", immediateRender: false }, 22.0);
