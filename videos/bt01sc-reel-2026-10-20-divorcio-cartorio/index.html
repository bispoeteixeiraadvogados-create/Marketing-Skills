<!doctype html>
<html
  lang="pt-BR"
  data-composition-variables='[{"id":"legendas","type":"boolean","label":"Legendas queimadas","default":true}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>BT.01.SC Reel 2026-10-20: divórcio em cartório com filhos menores</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #081a35;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #081a35;
      }
    </style>
  </head>
  <body>
    <!--
      Reel V1 · 42 s · 1080 x 1920 · 30 fps
      S1 0.0-3.5 questions · S2 3.5-6.2 answer · S3 6.2-15.0 condition · S4 15.0-22.0 caveat
      S5 22.0-31.0 escritura · S6 31.0-39.0 synthesis · S7 39.0-42.0 signature
      The desk (S1-S6) is one sub-composition so the camera and the paper stay in one physical space;
      typography for S4-S6, the signature and the captions ride above it.
    -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="42" data-width="1080" data-height="1920">
      <div
        id="mesa-host"
        data-composition-id="mesa"
        data-composition-src="compositions/mesa.html"
        data-start="0"
        data-duration="39.6"
        data-track-index="0"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="ressalva-host"
        data-composition-id="ressalva"
        data-composition-src="compositions/ressalva.html"
        data-start="15"
        data-duration="7.4"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="escritura-textos-host"
        data-composition-id="escritura-textos"
        data-composition-src="compositions/escritura-textos.html"
        data-start="22"
        data-duration="9.2"
        data-track-index="2"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="sintese-textos-host"
        data-composition-id="sintese-textos"
        data-composition-src="compositions/sintese-textos.html"
        data-start="31"
        data-duration="8.6"
        data-track-index="3"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="assinatura-host"
        data-composition-id="assinatura"
        data-composition-src="compositions/assinatura.html"
        data-start="38.5"
        data-duration="3.5"
        data-track-index="4"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="legendas-host"
        data-track-kind="captions"
        data-composition-id="legendas"
        data-composition-src="compositions/legendas.html"
        data-start="0"
        data-duration="42"
        data-track-index="20"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- audio stems: scripts/build_audio.py (voice ElevenLabs, music and paper SFX synthesized in-project) -->
      <audio id="voz" src="assets/audio/voz_narracao_v1.wav" data-start="0" data-duration="42" data-track-index="10" data-volume="1"></audio>
      <audio id="trilha" src="assets/audio/trilha_original_v1.wav" data-start="0" data-duration="42" data-track-index="11" data-volume="1"></audio>
      <audio id="sfx" src="assets/audio/sfx_papel_v1.wav" data-start="0" data-duration="42" data-track-index="12" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // "legendas" = false renders the clean version (captions only in the .srt).
      const vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
      if (vars.legendas === false) gsap.set("#legendas-host", { opacity: 0 });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
